version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: previa-postgres
    restart: always
    environment:
      POSTGRES_USER: previa_user
      POSTGRES_PASSWORD: previa_password_2026
      POSTGRES_DB: previa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: previa-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: previa-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: previa_admin
      MINIO_ROOT_PASSWORD: previa_password_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
